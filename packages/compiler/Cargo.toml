[package]
name = "dom-expressions-compiler"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
repository = "https://github.com/yumemi-thomas/solid-1x-compiler"
rust-version = "1.97"

[features]
native-facts = ["napi/noop"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
html5ever = "0.39.0"
htmlize = { version = "1", features = ["unescape"] }
markup5ever_rcdom = "0.39.0"
napi = { version = "3.8", default-features = false, features = ["napi4"] }
napi-derive = "3.5"
oxc_allocator = "0.118"
oxc_ast = "0.118"
oxc_ast_visit = "0.118"
oxc_codegen = "0.118"
oxc_parser = "0.118"
oxc_semantic = "0.118"
oxc_span = "0.118"
oxc_syntax = "0.118"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
# `noop` stubs the Node-API symbols so `cargo test` can link the unit-test
# harness (the classification-trace tests) without a Node host. Dev-only:
# the shipped cdylib is unaffected.
napi = { version = "3.8", default-features = false, features = ["napi4", "noop"] }

[build-dependencies]
napi-build = "2.2"
