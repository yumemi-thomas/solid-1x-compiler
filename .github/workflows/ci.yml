name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/compiler
      - run: cargo fmt --manifest-path packages/compiler/Cargo.toml -- --check
      # Both configurations: the Node addon build, then the Node-free core the
      # Rust consumers link (where the integration tests run).
      - run: cargo clippy --manifest-path packages/compiler/Cargo.toml --all-targets
      - run: cargo clippy --manifest-path packages/compiler/Cargo.toml --no-default-features --all-targets
      - run: cargo test --manifest-path packages/compiler/Cargo.toml
      - run: cargo test --manifest-path packages/compiler/Cargo.toml --no-default-features
      # `native-facts` is a deprecated alias existing pins still pass. It must
      # stay inert: enabling it alongside the default features must not strip
      # anything the Node adapter needs.
      - run: cargo check --manifest-path packages/compiler/Cargo.toml --features native-facts --all-targets

  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/compiler
      - run: pnpm install --frozen-lockfile
      - name: Jest suite
        run: pnpm run test
      - name: Babel 1.x parity
        run: pnpm run parity
